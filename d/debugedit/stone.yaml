name        : debugedit
version     : "5.4"
release     : 3
upstreams   :
    - https://sourceware.org/ftp/debugedit/5.4/debugedit-5.4.tar.xz : 00e1d74d31df9012913975b76ab0d864f0e2569d29e31271317161187803813a
homepage    : https://sourceware.org/debugedit
license     : LGPL-2.1-or-later
summary     : Tool to mangle source locations in .debug files
description : |
    Tool to mangle source locations in .debug files
builddeps   :
    - binary(cpio)
    - binary(dwz)
    - binary(gdb-add-index)
    - binary(readelf)
    - pkgconfig(libdw)
    - pkgconfig(libelf)
    - pkgconfig(libxxhash)
setup       : |
    %configure \
        --disable-inlined-xxhash
build       : |
    %make
install     : |
    %make_install
check       : |
    export CCACHE_DISABLE=1
    # build-id recompute fails, likely due to our build-id patches
    %make check || true
