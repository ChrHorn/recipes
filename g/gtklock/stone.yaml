name        : gtklock
version     : "5.0.0"
release     : 2
homepage    : https://github.com/jovanlanik/gtklock
upstreams   :
    - https://github.com/jovanlanik/gtklock/archive/refs/tags/v5.0.0.tar.gz : 018c50cf1d7b626f823e797750e5b304511b3b359e7277e8abb3383c11e7aed9
summary     : Lock screen based on gtkgreet
description : |
    A lock screen based on gtkgreet. It uses the ext-session-lock Wayland protocol. Works on sway and other wlroots-based compositors.
license     : GPL-3.0-or-later
builddeps   :
    - binary(msgfmt)
    - binary(scdoc)
    - pkgconfig(gmodule-export-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(gtk-session-lock-0)
    - pkgconfig(pam)
setup       : |
    %meson --sysconfdir=%(vendordir)
build       : |
    %meson_build
install     : |
    %meson_install
